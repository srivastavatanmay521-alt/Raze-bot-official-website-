kind = "web"
previewPath = "/"
title = "RazeBot Website"
version = "1.0.0"
id = "artifacts/razebot-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18405

[services.development]
run = "pnpm --filter @workspace/razebot-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/razebot-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/razebot-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18405"
BASE_PATH = "/"
